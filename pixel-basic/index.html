<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIXEL BASIC</title>
  </head>
  <body>
    <div id="app">
      <!-- Full-screen Canvas Background -->
      <canvas id="graphics-canvas"></canvas>

      <!-- Overlay UI -->
      <div id="ui-overlay">
        <h1>PIXEL BASIC</h1>

        <div id="editor-container">
          <!-- The fixed viewport list -->
          <div id="commands-container">
            <!-- Rendered lines go here dynamically -->
          </div>

          <!-- Bottom input bar -->

          <div>
            <!-- New Error Banner -->
            <div id="error-display" style="display: none"></div>

            <!-- Form Container Wrapper -->
            <div style="position: relative; width: 100%">
              <!-- New Autocomplete List -->
              <ul id="autocomplete-list" style="display: none"></ul>

              <form id="input-form">
                <input
                  type="text"
                  id="input"
                  autocomplete="off"
                  spellcheck="false"
                />
                <button id="submit-button" type="submit">ENTER</button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <button id="hud-toggle">EDITOR</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
