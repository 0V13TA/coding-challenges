<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIXEL BASIC</title>
</head>

<body>
  <div id="app">
    <header id="top-bar">
      <div class="brand">PIXEL BASIC</div>
      <div class="controls">
        <a href="/" class="control-btn" style="text-decoration: none;">🏠 DASHBOARD</a>
        <button id="btn-run" class="control-btn play-btn">▶ RUN MAIN</button>
        <button id="btn-stop" class="control-btn stop-btn">🛑 STOP</button>
        <button id="btn-fullscreen" class="control-btn" title="Fullscreen Canvas">🖥️ FULLSCREEN</button>
        <input type="file" id="asset-input" hidden multiple accept="image/*,.ttf,.otf,.woff,.woff2" />
      </div>
    </header>

    <main id="workspace">
      <!-- 1. The File Explorer -->
      <aside id="sidebar-pane">
        <div class="sidebar-section">
          <div class="section-header">
            <span>SCRIPTS</span>
            <div style="display: flex; gap: 12px; align-items: center;">
              <!-- NEW: Import Script Trigger -->
              <label for="file-input" class="icon-btn" style="cursor: pointer;" title="Import Script">⬇</label>
              <button id="btn-new-file" class="icon-btn" title="New Script">+</button>
            </div>
          </div>

          <!-- NEW: The hidden input -->
          <input type="file" id="file-input" hidden accept=".basic,.txt" />

          <ul id="file-tree" class="tree-list"></ul>
        </div>
        <div class="sidebar-section">
          <div class="section-header">
            <span>ASSETS</span>
            <label for="asset-input" class="icon-btn" style="cursor: pointer;">+</label>
          </div>
          <ul id="asset-tree" class="tree-list"></ul>
        </div>
      </aside>

      <div id="drag-divider-1" class="drag-divider"></div>

      <!-- 2. The Code Editor -->
      <section id="editor-pane">
        <div id="active-file-tab">main.basic</div>
        <div id="editor-container"></div>
      </section>

      <div id="drag-divider-2" class="drag-divider"></div>

      <!-- 3. The Runtime Canvas -->
      <section id="canvas-pane">
        <div id="canvas-wrapper">
          <canvas id="graphics-canvas"></canvas>
        </div>
        <div id="error-display" style="display: none"></div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
