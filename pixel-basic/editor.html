<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIXEL BASIC</title>
</head>

<body>
  <div id="app">
    <header id="top-bar">
      <div class="brand">PIXEL BASIC</div>
      <div class="controls">
        <button id="btn-toggle-editor" class="control-btn toggle-btn">
          ◀ EDITOR
        </button>
        <a href="/" class="control-btn" style="text-decoration: none;">🏠 DASHBOARD</a>
        <button id="btn-assets" class="control-btn">📦 ASSETS</button>
        <button id="btn-run" class="control-btn play-btn">▶ RUN</button>
        <button id="btn-stop" class="control-btn stop-btn">🛑 STOP</button>
        <button id="btn-save" class="control-btn">💾 SAVE FILE</button>
        <label for="file-input" class="control-btn load-btn">📁 LOAD FILE</label>
        <input type="file" name="file-input" id="file-input" hidden />
      </div>
    </header>

    <main id="workspace">
      <section id="editor-pane">
        <div id="editor-container"></div>
      </section>

      <!-- Split Pane Resizer -->
      <div id="drag-divider"></div>

      <section id="canvas-pane">
        <div id="canvas-wrapper">
          <canvas id="graphics-canvas"></canvas>
        </div>
        <div id="error-display" style="display: none"></div>
      </section>
    </main>
  </div>
  <!-- Asset Manager Modal -->
  <div id="asset-modal" class="modal" style="display: none">
    <div class="modal-content">
      <div class="modal-header">
        <h2>ASSET MANAGER</h2>
        <button id="btn-close-assets" class="control-btn stop-btn">X</button>
      </div>
      <div class="modal-body">
        <ul id="asset-list"></ul>
        <div class="asset-upload-wrapper">
          <label for="asset-input" class="control-btn play-btn" style="width: 100%; box-sizing: border-box">➕ UPLOAD
            ASSET</label>
          <input type="file" id="asset-input" hidden multiple accept="image/*,.ttf,.otf,.woff,.woff2" />
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
